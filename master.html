<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BookMe" />
  <title>BookMe — главная</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="/subscription" id="sub-badge" style="display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:100px;font-size:13px;font-weight:600;background:rgba(124,58,237,.15);color:#9B5DFF;border:1px solid rgba(124,58,237,.2);text-decoration:none;transition:background .15s;" aria-label="Подписка">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span id="sub-plan-label">Free</span>
      </a>
      <span style="flex:1;"></span>
    </header>

    <section class="hero">
      <div class="greet" id="greet">Добрый день</div>
      <h2 id="user-name">—</h2>
      <p>Сегодня <span id="today-count">0</span> записей · впереди <span id="upcoming-count">0</span></p>
    </section>

    <div id="trial-banner-slot"></div>
    <!-- Compact push notification prompt -->
    <div id="push-banner" hidden style="margin:8px 20px 0;">
      <button id="push-enable-btn" style="width:100%;display:flex;align-items:center;gap:8px;background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text);transition:background .15s;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--purple,#7C3AED);flex-shrink:0;"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span style="flex:1;text-align:left;">Включить уведомления о записях</span>
        <span style="font-size:12px;background:var(--purple,#7C3AED);color:white;padding:2px 8px;border-radius:100px;">Вкл</span>
      </button>
    </div>

    <section class="stats">
      <a class="stat dark link" href="/analytics">
        <div class="stat-label">Выручка за 7 дней ›</div>
        <div class="stat-value" id="revenue">$0</div>
        <div class="stat-trend" id="revenue-trend">за неделю</div>
      </a>
      <a class="stat link" href="/analytics">
        <div class="stat-label">Записей всего ›</div>
        <div class="stat-value" id="total-bookings">0</div>
        <div class="stat-trend muted" id="total-trend">за всё время</div>
      </a>
    </section>

    <section class="section">
      <div class="section-head">
        <h3>Активность недели</h3>
        <a href="/analytics">Подробнее →</a>
      </div>
      <a class="card" href="/analytics" style="display:block;text-decoration:none;color:inherit;">
        <div class="flex-between" style="margin-bottom:6px;">
          <div class="muted" style="font-size:13px;">Записей в день</div>
          <div style="font-size:13px;font-weight:600;" id="week-total">0 за неделю</div>
        </div>
        <div class="barchart" id="barchart"></div>
        <div style="height:22px;"></div>
      </a>
    </section>

    <section style="margin-top:20px;">
      <div class="link-card" id="link-card">
        <div class="label">Моя ссылка</div>
        <div class="url" id="public-url">bookme.app/—</div>
        <div class="actions">
          <button class="pill solid" id="copy-btn" style="display:inline-flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Скопировать</button>
          <button class="pill" id="share-btn" style="display:inline-flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>Поделиться</button>
          <a class="pill" id="open-btn" href="#" target="_blank">→ Открыть</a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h3>Быстрые действия</h3></div>
      <div class="btn-row">
        <a class="btn-action" href="/services">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Услуга
        </a>
        <a class="btn-action" href="/analytics">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 16 4-4 4 4 4-6"/></svg>
          Аналитика
        </a>
        <a class="btn-action" href="/chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
          ИИ
        </a>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h3>Сегодня</h3>
        <a href="/bookings">Все →</a>
      </div>
      <div class="list" id="today-list"></div>
    </section>
  </div>

  <!-- Tabbar hardcoded — always visible regardless of JS state -->
  <nav class="tabbar">
    <div class="tabbar-inner">
      <a href="/master" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span>Главная</span>
      </a>
      <a href="/bookings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Записи</span>
      </a>
      <a href="/clients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
        <span>Клиенты</span>
      </a>
      <a href="/profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <span>Профиль</span>
      </a>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    (async () => {
      const auth = await requireAuth('master');
      if (!auth) return;
      const { session, profile } = auth;

      // Nav — immediately on auth (never wait for data)
      renderMasterTabBar('home');

      // Greeting
      const hr = new Date().getHours();
      document.getElementById('greet').textContent = hr < 5 ? 'Доброй ночи' : hr < 12 ? 'Доброе утро' : hr < 18 ? 'Добрый день' : 'Добрый вечер';
      const displayName = profile.name || profile.email;
      document.getElementById('user-name').textContent = displayName;

      // Load master record
      const { data: master } = await sb.from('masters').select('*').eq('id', profile.id).single();

      // Update subscription badge
      const planMap = { trial:'Trial', free:'Free', pro:'Pro ✦', studio:'Studio ★' };
      const badge = document.getElementById('sub-plan-label');
      if (badge && master) {
        badge.textContent = planMap[master.plan] || 'Free';
        const wrap = document.getElementById('sub-badge');
        if (master.plan === 'pro' || master.plan === 'studio') {
          wrap.style.background = 'rgba(124,58,237,.2)';
          wrap.style.borderColor = 'rgba(124,58,237,.4)';
        } else if (master.plan === 'trial') {
          wrap.style.background = 'rgba(217,119,6,.12)';
          wrap.style.color = '#D97706';
          wrap.style.borderColor = 'rgba(217,119,6,.25)';
        }
      }

      // Trial banner
      if (master && master.plan === 'trial') {
        const ms = new Date(master.trial_ends) - new Date();
        const days = Math.max(0, Math.ceil(ms / 86400000));
        document.getElementById('trial-banner-slot').innerHTML = `
          <div class="trial-banner">
            <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
            <div class="text"><strong>Пробный период</strong>${days === 0 ? 'Истёк — продлите доступ' : `Осталось ${days} ${days === 1 ? 'день' : days < 5 ? 'дня' : 'дней'}`}</div>
            <a href="/subscription">Выбрать тариф</a>
          </div>`;
      }

      // Load bookings
      // ── Render function (used for initial load + realtime updates) ──
      const days7 = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
      function renderDashboard(bookings) {
        const stats = calcStats(bookings);

        // Animate stat numbers counting up
        animateNumber(document.getElementById('today-count'),    stats.todayCount);
        animateNumber(document.getElementById('upcoming-count'), stats.upcomingCount);
        animateNumber(document.getElementById('revenue'),        stats.revenue7, { prefix: '$' });
        animateNumber(document.getElementById('total-bookings'), bookings.length);
        document.getElementById('revenue-trend').textContent  = stats.revenue7 > 0 ? `$${stats.revenue7.toLocaleString('ru')} за 7 дней` : 'нет записей';
        document.getElementById('total-trend').textContent    = bookings.length ? `${bookings.length} клиентов` : 'за всё время';

        // Pop animation on stat cards
        animateStats(['.stat.dark .stat-value', '.stat:not(.dark) .stat-value']);

        const maxC = Math.max(1, ...stats.weekData.map(d => d.count));
        document.getElementById('barchart').innerHTML = stats.weekData.map(d => {
          const dt = new Date(d.iso);
          const h = Math.max(6, Math.round((d.count / maxC) * 100));
          return `<div class="bar ${d.count === 0 ? 'muted' : ''}" style="height:${h}%"><span class="label">${days7[dt.getDay()]}</span></div>`;
        }).join('');
        document.getElementById('week-total').textContent = `${stats.weekData.reduce((s,d) => s+d.count,0)} за неделю`;

        const todayB = bookingsByDate(bookings, 'today');
        const todayList = document.getElementById('today-list');
        if (!todayB.length) {
          todayList.innerHTML = `<div class="empty anim-fade-up"><div class="empty-icon" style="font-size:0;">${Icons.coffee}</div><h4>Сегодня свободно</h4><p>Поделитесь ссылкой — клиенты запишутся сами</p></div>`;
        } else {
          todayList.innerHTML = todayB.map(b => `
            <div class="row-item">
              <div class="mini-avatar gradient">${(b.client_name||'?').charAt(0)}</div>
              <div class="meta"><div class="title">${b.client_name}</div><div class="sub">${b.service_name}</div></div>
              <div class="meta" style="text-align:right;flex:0 0 auto;">
                <div class="title" style="font-size:14px;">${b.time}</div>
                <span class="chip-status today">сегодня</span>
              </div>
            </div>`).join('');
        }
        staggerList(document.getElementById('today-list'));
        renderMasterTabBar('home', { bookings: stats.todayCount || '' });
      }

      // Show skeleton while data loads
      document.getElementById('today-list').innerHTML = skCards(2);

      // Load bookings + render
      const { data: bookings = [] } = await sb.from('bookings')
        .select('*').eq('master_id', profile.id).eq('status', 'upcoming');
      renderDashboard(bookings);

      // Public link
      const username = master?.username || profile.id;
      document.getElementById('public-url').textContent = getPrettyUrl(username);
      const pubUrl = getPublicUrl(username);
      document.getElementById('open-btn').href = pubUrl;
      document.getElementById('copy-btn').addEventListener('click', () => copyToClipboard(pubUrl));
      document.getElementById('share-btn').addEventListener('click', async () => {
        const ok = await shareLink(pubUrl, 'Запись к ' + (profile.name || 'мастеру'));
        if (!ok) {
          openSheet(`<h3>Поделиться ссылкой</h3>
            <div class="card center" style="font-family:monospace;font-size:14px;font-weight:600;word-break:break-all;">${getPrettyUrl(username)}</div>
            <div class="btn-row mt-12">
              <button class="btn btn-secondary" onclick="closeSheet()">Закрыть</button>
              <button class="btn btn-primary" onclick="copyToClipboard('${pubUrl}');closeSheet()">Скопировать</button>
            </div>`);
        }
      });

      // Realtime: update DOM in-place — no page reload
      sb.channel('master-home-bookings')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings', filter: `master_id=eq.${profile.id}` },
          async () => {
            const { data: updated = [] } = await sb.from('bookings')
              .select('*').eq('master_id', profile.id).eq('status', 'upcoming');
            renderDashboard(updated);
          })
        .subscribe();

      // Push notifications — shown only if not yet subscribed, triggered by user tap
      const pushBanner = document.getElementById('push-banner');
      const pushBtn    = document.getElementById('push-enable-btn');
      if ('PushManager' in window && Notification.permission !== 'granted') {
        pushBanner.hidden = false;
      }
      pushBtn.addEventListener('click', async () => {
        pushBanner.hidden = true;
        await setupPush(profile.id);
        if (Notification.permission === 'granted') toast('Уведомления включены');
      });
    })();
  </script>
</body>
</html>
