<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0A0A0A"/>
  <title>BookMe — Клиенты</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="apple-touch-icon.png"/>
  <link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon-512.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="icon-btn-circle" onclick="history.length > 1 ? history.back() : location.href='/master'" href="#" aria-label="Назад" style="display:inline-flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>Клиенты</h1>
    <span class="right-spacer"></span>
  </header>

  <section class="hero" style="padding-bottom:8px;">
    <div class="greet">Мои клиенты</div>
    <h2 id="cl-count">—</h2>
    <p id="cl-sub">Все кто записывался к вам</p>
  </section>

  <!-- Search -->
  <div style="padding:0 20px 14px;">
    <div style="position:relative;">
      <input id="search" type="search" placeholder="Поиск по имени или телефону…"
        style="width:100%;box-sizing:border-box;padding:11px 16px 11px 42px;
               border:1px solid var(--border);border-radius:var(--r);font-size:15px;
               background:var(--surface);color:var(--text);outline:none;"/>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"
        style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </div>
  </div>

  <!-- Sort tabs -->
  <div class="tabs" style="margin-bottom:8px;" role="tablist">
    <div class="tab active" data-sort="last">Последние</div>
    <div class="tab" data-sort="frequent">Постоянные</div>
    <div class="tab" data-sort="name">А–Я</div>
  </div>

  <section class="section" style="margin-top:0;">
    <div class="list stagger" id="clients-list"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
let _masterId, _allClients = [], _sort = 'last', _query = '';

async function load() {
  // Get unique clients from bookings with aggregate data
  const { data: bookings = [] } = await sb.from('bookings')
    .select('client_id, client_name, client_phone, date_iso, service_name, service_price, status')
    .eq('master_id', _masterId)
    .not('client_id', 'is', null)
    .order('date_iso', { ascending: false });

  // Group by client_id
  const map = new Map();
  for (const b of bookings) {
    if (!b.client_id) continue;
    if (!map.has(b.client_id)) {
      map.set(b.client_id, {
        id: b.client_id,
        name: b.client_name,
        phone: b.client_phone,
        lastDate: b.date_iso,
        lastService: b.service_name,
        totalBookings: 0,
        totalRevenue: 0,
      });
    }
    const c = map.get(b.client_id);
    c.totalBookings++;
    if (b.status !== 'cancelled') c.totalRevenue += b.service_price || 0;
    if (b.date_iso > c.lastDate) {
      c.lastDate = b.date_iso;
      c.lastService = b.service_name;
    }
  }

  _allClients = [...map.values()];
  document.getElementById('cl-count').textContent = _allClients.length + ' клиентов';
  render();
}

function render() {
  const q = _query.toLowerCase();
  let list = q
    ? _allClients.filter(c =>
        c.name?.toLowerCase().includes(q) || c.phone?.includes(q))
    : [..._allClients];

  if (_sort === 'last')     list.sort((a, b) => b.lastDate.localeCompare(a.lastDate));
  if (_sort === 'frequent') list.sort((a, b) => b.totalBookings - a.totalBookings);
  if (_sort === 'name')     list.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'));

  const container = document.getElementById('clients-list');
  if (!list.length) {
    container.innerHTML = `<div class="empty">
      <div class="empty-icon" style="font-size:0;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
      </div>
      <h4>${q ? 'Не найдено' : 'Клиентов пока нет'}</h4>
      <p>${q ? 'Попробуйте другой запрос' : 'Они появятся после первых записей'}</p>
    </div>`;
    return;
  }

  container.innerHTML = list.map(c => {
    const initials = (c.name || '?').charAt(0).toUpperCase();
    const sub = [
      c.totalBookings + ' ' + plural(c.totalBookings, 'запись','записи','записей'),
      c.lastService,
    ].filter(Boolean).join(' · ');
    return `<div class="client-row" data-id="${c.id}">
      <div class="mini-avatar gradient" style="width:48px;height:48px;font-size:19px;flex-shrink:0;">${initials}</div>
      <div class="cr-info">
        <div class="cr-name">${c.name || 'Без имени'}</div>
        <div class="cr-sub">${sub}</div>
      </div>
      <div class="cr-actions">
        <a href="tel:${(c.phone||'').replace(/\s/g,'')}"
          class="cr-action-btn" title="Позвонить" onclick="event.stopPropagation()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.07 14.89a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 2.97 4h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 11.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 19z"/></svg>
        </a>
      </div>
    </div>`;
  }).join('');

  // Click for detail sheet
  container.querySelectorAll('.client-row').forEach(row => {
    row.addEventListener('click', () => {
      const client = list.find(c => c.id === row.dataset.id);
      if (!client) return;
      openClientSheet(client);
    });
  });

  staggerList(container);
}

function openClientSheet(c) {
  openSheet(`
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
      <div class="mini-avatar gradient" style="width:56px;height:56px;font-size:22px;flex-shrink:0;">${(c.name||'?').charAt(0).toUpperCase()}</div>
      <div>
        <div style="font-size:20px;font-weight:700;letter-spacing:-0.02em;">${c.name||'Без имени'}</div>
        <div class="muted" style="font-size:14px;">${c.phone||'—'}</div>
      </div>
    </div>
    <div class="card" style="padding:6px 16px;margin-bottom:16px;">
      <div class="flex-between" style="padding:10px 0;border-bottom:1px solid var(--border);">
        <span class="muted" style="font-size:13px;">Всего записей</span>
        <span style="font-weight:600;">${c.totalBookings}</span>
      </div>
      <div class="flex-between" style="padding:10px 0;border-bottom:1px solid var(--border);">
        <span class="muted" style="font-size:13px;">Последняя услуга</span>
        <span style="font-weight:600;font-size:14px;">${c.lastService||'—'}</span>
      </div>
      <div class="flex-between" style="padding:10px 0;">
        <span class="muted" style="font-size:13px;">Последний визит</span>
        <span style="font-weight:600;">${c.lastDate||'—'}</span>
      </div>
    </div>
    <div class="btn-row">
      <a href="tel:${(c.phone||'').replace(/\s/g,'')}" class="btn btn-primary">Позвонить</a>
    </div>
    <button class="btn btn-secondary" style="margin-top:10px;" onclick="closeSheet()">Закрыть</button>
  `);
}

function plural(n, one, few, many) {
  const r = n % 100;
  if (r >= 11 && r <= 19) return many;
  switch (r % 10) {
    case 1: return one;
    case 2: case 3: case 4: return few;
    default: return many;
  }
}

(async () => {
  const auth = await requireAuth('master');
  if (!auth) return;
  _masterId = auth.profile.id;
  renderMasterTabBar('clients'); // immediately — don't wait for data

  document.getElementById('search').addEventListener('input', e => {
    _query = e.target.value; render();
  });
  document.querySelectorAll('.tab[data-sort]').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab[data-sort]').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      _sort = tab.dataset.sort; render();
    });
  });

  await load();
})();
</script>
</body>
</html>
