<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BookMe" />
  <title>BookMe — запись</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="public">
    <header class="topbar">
      <a class="icon-btn-circle" id="back" href="#" aria-label="Назад" style="display:inline-flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
      <h1 id="title">Дата и время</h1>
      <span class="right-spacer"></span>
    </header>

    <div class="steps" id="steps">
      <div class="step-dot done"></div>
      <div class="step-dot done"></div>
      <div class="step-dot"></div>
    </div>

    <!-- Form view -->
    <div id="form-view">
      <section class="section" style="margin-top:0;">
        <h3 class="section-title" style="font-size:13px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin:0 4px 10px;font-weight:600;">Услуга</h3>
        <div class="row-item">
          <div class="meta"><div class="title" id="s-name">—</div><div class="sub" id="s-duration">—</div></div>
          <div class="price" id="s-price">—</div>
        </div>
      </section>

      <section class="section">
        <h3 class="section-title" style="font-size:13px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin:0 4px 10px;font-weight:600;">Дата</h3>
        <div class="chips" id="dates"></div>
      </section>

      <section class="section">
        <h3 class="section-title" style="font-size:13px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin:0 4px 10px;font-weight:600;">Свободное время</h3>
        <div class="time-grid" id="times"></div>
      </section>

      <section class="section">
        <h3 class="section-title" style="font-size:13px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin:0 4px 10px;font-weight:600;">Ваши данные</h3>
        <div class="card">
          <div class="field"><label for="c-name">Имя</label><input id="c-name" type="text" placeholder="Как к вам обращаться" autocomplete="name" /></div>
          <div class="field"><label for="c-phone">Телефон</label><input id="c-phone" type="tel" placeholder="+___ ___-___-____" autocomplete="tel" /></div>
          <div class="field" style="margin-bottom:0;"><label for="c-email">Email (необязательно)</label><input id="c-email" type="email" placeholder="для напоминания" autocomplete="email" /></div>
        </div>
      </section>

      <div class="sticky-cta">
        <button class="btn btn-primary" id="confirm-btn">Подтвердить запись</button>
      </div>
    </div>

    <!-- Success view -->
    <div id="success-view" hidden>
      <div class="success">
        <div class="success-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <h2>Запись подтверждена</h2>
        <p>Мы напомним о визите за час</p>
      </div>
      <div class="section">
        <div class="card">
          <div class="flex-between" style="padding-bottom:12px;border-bottom:1px solid var(--border);"><span class="muted" style="font-size:13px;">Услуга</span><span style="font-weight:600;font-size:14px;" id="r-service">—</span></div>
          <div class="flex-between" style="padding:12px 0;border-bottom:1px solid var(--border);"><span class="muted" style="font-size:13px;">Когда</span><span style="font-weight:600;font-size:14px;" id="r-when">—</span></div>
          <div class="flex-between" style="padding:12px 0;border-bottom:1px solid var(--border);"><span class="muted" style="font-size:13px;">Клиент</span><span style="font-weight:600;font-size:14px;" id="r-client">—</span></div>
          <div class="flex-between" style="padding-top:12px;"><span class="muted" style="font-size:13px;">К оплате</span><span style="font-weight:700;font-size:16px;" id="r-price">—</span></div>
        </div>
      </div>
      <div class="section">
        <div class="btn-row">
          <a class="btn btn-secondary" id="back-link">Готово</a>
          <button class="btn btn-primary" id="add-calendar">+ В календарь</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    (async () => {
      const params    = new URLSearchParams(location.search);
      const username  = params.get('u');
      const serviceId = params.get('s');
      const backUrl   = `/p?u=${encodeURIComponent(username)}`;

      document.getElementById('back').href     = backUrl;
      document.getElementById('back-link').href = backUrl;

      // Load master + service + session in parallel
      const [{ data: master }, { data: service }, session] = await Promise.all([
        sb.from('masters').select('*, profiles(name)').eq('username', username).single(),
        sb.from('services').select('*').eq('id', serviceId).single(),
        getSession(),
      ]);

      if (!master || !service) { location.href = backUrl; return; }

      document.getElementById('s-name').textContent     = service.name;
      document.getElementById('s-duration').textContent = service.duration + ' мин';
      document.getElementById('s-price').textContent    = fmt$(service.price);

      // Date chips
      const datesEl = document.getElementById('dates');
      const days7   = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
      let selectedDate = null;

      for (let i = 0; i < 14; i++) {
        const d = new Date(); d.setDate(d.getDate() + i);
        const chip = document.createElement('div');
        chip.className    = 'chip';
        chip.dataset.iso  = d.toISOString().slice(0,10);
        chip.innerHTML    = `<div class="day">${i===0?'СЕГ':i===1?'ЗАВ':days7[d.getDay()]}</div><div class="num">${d.getDate()}</div>`;
        chip.addEventListener('click', () => {
          datesEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          selectedDate = { iso: chip.dataset.iso, d, label: i===0?'Сегодня':i===1?'Завтра':fmtDate(d) };
          renderTimes();
        });
        datesEl.appendChild(chip);
      }

      // Time slots
      const timesEl = document.getElementById('times');
      let selectedTime = null;

      async function renderTimes() {
        timesEl.innerHTML = '<div class="spinner-center"><div class="spinner"></div></div>';
        selectedTime = null;
        const { data: booked = [] } = await sb.from('bookings')
          .select('time').eq('master_id', master.id).eq('date_iso', selectedDate.iso).eq('status', 'upcoming');
        timesEl.innerHTML = '';
        const busySet = new Set(booked.map(b => b.time));
        for (let h = 9; h <= 19; h++) {
          for (const m of [0, 30]) {
            if (h === 19 && m === 30) continue;
            const t    = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
            const slot = document.createElement('div');
            slot.className   = 'time-slot' + (busySet.has(t) ? ' disabled' : '');
            slot.textContent = t;
            slot.addEventListener('click', () => {
              if (busySet.has(t)) return;
              timesEl.querySelectorAll('.time-slot').forEach(s => s.classList.remove('active'));
              slot.classList.add('active');
              selectedTime = t;
            });
            timesEl.appendChild(slot);
          }
        }
      }
      datesEl.firstChild.click();

      // Phone — free format with auto country prefix
      const phone = document.getElementById('c-phone');
      const tzCountry = {
        'Europe/Chisinau':'+373','Europe/Bucharest':'+40','Europe/Kyiv':'+380',
        'Europe/Kiev':'+380','Europe/Minsk':'+375','Europe/Warsaw':'+48',
        'Europe/Berlin':'+49','Europe/Vienna':'+43','Europe/Prague':'+420',
        'Europe/Budapest':'+36','Europe/Sofia':'+359','Europe/Vilnius':'+370',
        'Europe/Riga':'+371','Europe/Tallinn':'+372','Europe/Helsinki':'+358',
        'Europe/Stockholm':'+46','Europe/Oslo':'+47','Europe/Copenhagen':'+45',
        'Europe/Amsterdam':'+31','Europe/Brussels':'+32','Europe/Paris':'+33',
        'Europe/Madrid':'+34','Europe/Lisbon':'+351','Europe/Rome':'+39',
        'Europe/Zurich':'+41','Europe/London':'+44','Europe/Dublin':'+353',
        'Europe/Athens':'+30','Europe/Istanbul':'+90','Asia/Dubai':'+971',
        'Asia/Tbilisi':'+995','Asia/Baku':'+994','Asia/Yerevan':'+374',
        'Asia/Almaty':'+7','Asia/Tashkent':'+998','Asia/Dushanbe':'+992',
        'America/New_York':'+1','America/Chicago':'+1','America/Los_Angeles':'+1',
        'America/Toronto':'+1','Asia/Tokyo':'+81','Asia/Seoul':'+82',
        'Asia/Shanghai':'+86','Asia/Singapore':'+65','Asia/Kolkata':'+91',
      };
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const prefix = tzCountry[tz] || '';
      if (prefix && !phone.value) {
        phone.value = prefix + ' ';
        phone.placeholder = prefix + ' ___-___-____';
      }
      phone.addEventListener('input', () => {
        phone.value = phone.value.replace(/[^\d\s\+\-\(\)]/g, '');
      });

      // Pre-fill from session (loaded in parallel above)
      if (session) {
        const p = await getProfile(session.user.id);
        if (p) { document.getElementById('c-name').value = p.name||''; document.getElementById('c-email').value = p.email||''; }
      }

      // Confirm booking
      let lastBooking = null;
      const confirmBtn = document.getElementById('confirm-btn');
      confirmBtn.addEventListener('click', async () => {
        const clientName  = document.getElementById('c-name').value.trim();
        const clientPhone = phone.value.trim();
        const clientEmail = document.getElementById('c-email').value.trim();
        if (!selectedDate)  { toast('Выберите дату');  return; }
        if (!selectedTime)  { toast('Выберите время'); return; }
        if (!clientName)    { toast('Укажите имя');    return; }
        if (clientPhone.replace(/\D/g,'').length < 6) { toast('Укажите корректный телефон'); return; }
        confirmBtn.disabled = true; confirmBtn.textContent = 'Подтверждаем…';

        // Race-condition guard: re-verify slot is still free
        const { data: taken } = await sb.from('bookings')
          .select('id').eq('master_id', master.id)
          .eq('date_iso', selectedDate.iso).eq('time', selectedTime)
          .neq('status', 'cancelled').maybeSingle();
        if (taken) {
          toast('Это время только что заняли. Выберите другое.');
          await renderTimes(); return;
        }

        const { data, error } = await sb.from('bookings').insert({
          master_id:        master.id,
          client_id:        session?.user?.id || null,
          service_id:       service.id,
          service_name:     service.name,
          service_price:    service.price,
          service_duration: service.duration,
          date_iso:         selectedDate.iso,
          time:             selectedTime,
          client_name:      clientName,
          client_phone:     clientPhone,
          client_email:     clientEmail || null,
          status:           'upcoming',
        }).select().single();

        if (error) {
          confirmBtn.disabled = false; confirmBtn.textContent = 'Подтвердить запись';
          if (error.code === '23505') {
            toast('Это время только что заняли. Выберите другое.');
            await renderTimes();
          } else {
            toast('Ошибка: ' + error.message);
          }
          return;
        }
        lastBooking = data;

        // Notify master
        sendPush(master.id, {
          title: 'Новая запись!',
          body:  `${clientName} — ${service.name}, ${selectedDate.label} в ${selectedTime}`,
          url:   '/bookings',
        });
        // Notify client (if logged in)
        if (session?.user?.id) {
          sendPush(session.user.id, {
            title: 'Запись подтверждена',
            body:  `${service.name}, ${selectedDate.label} в ${selectedTime}`,
            url:   '/client#bookings',
          });
        }

        document.querySelectorAll('#steps .step-dot').forEach(d => d.classList.add('done'));
        document.getElementById('title').textContent    = 'Готово';
        document.getElementById('form-view').hidden     = true;
        document.getElementById('success-view').hidden  = false;
        document.getElementById('r-service').textContent = service.name;
        document.getElementById('r-when').textContent    = `${selectedDate.label}, ${selectedTime}`;
        document.getElementById('r-client').textContent  = `${clientName} · ${clientPhone}`;
        document.getElementById('r-price').textContent   = fmt$(service.price);
        window.scrollTo({ top:0, behavior:'smooth' });
      });

      // .ics export
      document.getElementById('add-calendar').addEventListener('click', () => {
        if (!lastBooking) return;
        const start = new Date(lastBooking.date_iso + 'T' + lastBooking.time + ':00');
        const end   = new Date(start.getTime() + (service.duration * 60000));
        const fmtD  = d => d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
        const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BookMe//RU','BEGIN:VEVENT',
          `UID:${lastBooking.id}@bookme.app`,`DTSTAMP:${fmtD(new Date())}`,
          `DTSTART:${fmtD(start)}`,`DTEND:${fmtD(end)}`,
          `SUMMARY:${service.name} — ${master.profiles?.name||'Мастер'}`,
          `DESCRIPTION:${lastBooking.client_name || ''}, ${lastBooking.client_phone || ''}`,
          'END:VEVENT','END:VCALENDAR'].join('\r\n');
        const a = Object.assign(document.createElement('a'), {
          href: URL.createObjectURL(new Blob([ics],{type:'text/calendar'})),
          download:'bookme.ics',
        });
        document.body.appendChild(a); a.click(); a.remove();
        toast('Файл календаря загружен');
      });
    })();
  </script>
</body>
</html>
