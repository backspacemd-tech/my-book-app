<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BookMe" />
  <title>BookMe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div style="display:flex;align-items:center;justify-content:center;height:100dvh;flex-direction:column;gap:12px;">
    <div style="font-size:28px;font-weight:800;letter-spacing:-0.04em;">Book<span style="color:#e11d48;">Me</span></div>
    <div class="muted" style="font-size:14px;">Загрузка…</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    (async () => {
      const session = await getSession();
      if (!session) { window.location.href = '/'; return; }
      // Handle OAuth redirect: wait for profile trigger
      let profile = null;
      for (let i = 0; i < 5; i++) {
        profile = await getProfile(session.user.id);
        if (profile) break;
        await new Promise(r => setTimeout(r, 600));
      }
      if (!profile) {
        profile = await ensureProfile(session.user, { email: session.user.email, name: session.user.user_metadata?.name || undefined });
      }
      if (!profile) { window.location.href = '/'; return; }
      redirectByRole(profile.role);
    })();
  </script>
</body>
</html>
