<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>BookMe — загрузка</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app no-nav" style="min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;">
    <div>
      <img src="logo.svg" alt="BookMe" style="width:72px;height:72px;border-radius:20px;margin-bottom:18px;" />
      <div class="spinner" style="margin:0 auto 14px;"></div>
      <p class="muted" style="font-size:14px;">Открываем ваш кабинет…</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    (async () => {
      const session = await getSession();
      if (!session) { location.replace('/login'); return; }
      const profile = await getProfile(session.user.id)
        || await ensureProfile(session.user, {
          email: session.user.email,
          name: session.user.user_metadata?.name || session.user.user_metadata?.full_name || undefined,
        });
      redirectByRole(profile?.role || 'client');
    })();
  </script>
</body>
</html>
