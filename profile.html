<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0A0A0A"/>
  <title>BookMe · Профиль</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="left-spacer"></span>
    <span></span>
    <!-- Settings gear -->
    <a href="/settings" class="icon-btn-circle" aria-label="Настройки" style="display:inline-flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </a>
  </header>

  <!-- Profile header -->
  <div style="padding:8px 20px 0;">
    <!-- Cover -->
    <div id="cover-area" style="height:120px;border-radius:var(--r-lg);background:linear-gradient(135deg,#0A0A0A 0%,#2D1B69 60%,#4C1D95 100%);overflow:hidden;position:relative;margin-bottom:-44px;cursor:pointer;">
      <div id="cover-label" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:13px;gap:6px;background:rgba(0,0,0,.2);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Добавить обложку
      </div>
    </div>

    <!-- Avatar row -->
    <div style="display:flex;align-items:flex-end;justify-content:space-between;padding:0 4px;position:relative;z-index:2;">
      <div id="avatar-wrap" style="cursor:pointer;position:relative;">
        <div id="avatar" style="width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#1F1F22,#4A4A50);color:white;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;border:4px solid var(--bg);box-sizing:content-box;background-size:cover;background-position:center;"></div>
        <div style="position:absolute;bottom:4px;right:4px;width:26px;height:26px;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
      </div>
      <a href="/profile-edit" class="btn btn-secondary btn-sm" style="margin-bottom:8px;">Редактировать</a>
    </div>

    <!-- Name & info -->
    <div style="padding:10px 4px 0;">
      <div style="font-size:22px;font-weight:700;letter-spacing:-0.02em;" id="p-name">—</div>
      <div style="font-size:14px;color:var(--text-2);margin-top:2px;" id="p-specialty"></div>
      <div style="font-size:14px;color:var(--text-2);margin-top:2px;display:flex;align-items:center;gap:5px;" id="p-city-wrap" hidden>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="p-city"></span>
      </div>
      <p style="font-size:14px;color:var(--text-2);margin:8px 0 0;line-height:1.55;" id="p-bio"></p>
    </div>

    <!-- Stats row -->
    <div style="display:flex;gap:24px;padding:14px 4px 0;border-bottom:1px solid var(--border);padding-bottom:14px;">
      <div style="text-align:center;">
        <div style="font-size:18px;font-weight:700;" id="stat-bookings">0</div>
        <div style="font-size:12px;color:var(--text-2);">Записей</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:18px;font-weight:700;" id="stat-portfolio">0</div>
        <div style="font-size:12px;color:var(--text-2);">Фото</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:18px;font-weight:700;" id="stat-rating">—</div>
        <div style="font-size:12px;color:var(--text-2);">Рейтинг</div>
      </div>
    </div>

    <!-- My link -->
    <div id="link-row" style="padding:12px 4px 14px;border-bottom:1px solid var(--border);">
      <div style="font-size:12px;color:var(--text-2);font-weight:500;margin-bottom:4px;">Моя ссылка для записи</div>
      <div style="font-size:14px;font-weight:600;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:10px;" id="p-link">—</div>
      <div style="display:flex;gap:8px;">
        <button class="btn-action btn-sm" id="p-copy" style="flex:1;padding:10px 12px;font-size:13px;justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Копировать
        </button>
        <button class="btn-action btn-sm" id="p-share" style="flex:1;padding:10px 12px;font-size:13px;justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          Поделиться
        </button>
      </div>
    </div>
  </div>

  <!-- Tabs: Services / Portfolio -->
  <div class="tabs" style="margin:10px 20px 0;">
    <div class="tab active" id="tab-portfolio">Портфолио</div>
    <div class="tab" id="tab-services">Услуги</div>
  </div>

  <!-- Portfolio (Instagram 3-col grid) -->
  <div id="view-portfolio">
    <div class="insta-grid" id="portfolio-grid"></div>
    <div style="padding:14px 20px;">
      <button class="btn btn-secondary btn-sm" id="add-photo-btn" style="width:100%;gap:8px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Добавить фото
      </button>
    </div>
  </div>

  <!-- Services view -->
  <div id="view-services" hidden>
    <div class="list" style="padding:12px 20px;gap:10px;display:flex;flex-direction:column;" id="services-list"></div>
  </div>

</div>

<!-- Lightbox -->
<div id="lightbox" hidden style="position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;">
  <button onclick="closeLightbox()" style="position:absolute;top:calc(16px + var(--safe-top));right:16px;background:rgba(255,255,255,.15);border:none;width:40px;height:40px;border-radius:50%;color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;">×</button>
  <img id="lightbox-img" style="max-width:100%;max-height:90dvh;object-fit:contain;border-radius:4px;"/>
</div>

<style>
/* Portfolio grid — always 3 columns, square cells */
#view-portfolio { margin-top: 10px; }
.insta-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px;
  padding: 0;
}
.insta-item {
  aspect-ratio: 1 / 1;
  overflow: hidden;
  position: relative;
  background: var(--surface-2);
  cursor: pointer;
}
.insta-item img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .2s;
}
.insta-item:active img { transform: scale(.96); }
.insta-add {
  aspect-ratio: 1 / 1;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-2);
  cursor: pointer;
  color: var(--text-3);
  border: 2px dashed var(--border-strong);
}
.insta-del {
  position: absolute; top: 6px; right: 6px;
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(0,0,0,.65); color: white;
  border: none; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
let _profile, _master;

(async () => {
  const auth = await requireAuth('master');
  if (!auth) return;
  _profile = auth.profile;

  // Load master record
  const { data: master } = await sb.from('masters').select('*').eq('id', _profile.id).single();
  _master = master || {};

  // Render avatar
  const avatarEl = document.getElementById('avatar');
  if (_profile.avatar_url) {
    avatarEl.style.backgroundImage = `url(${_profile.avatar_url})`;
    avatarEl.textContent = '';
  } else {
    avatarEl.textContent = (_profile.name||'?').charAt(0).toUpperCase();
  }

  // Cover
  const coverEl = document.getElementById('cover-area');
  if (_master.cover_url) {
    coverEl.style.backgroundImage = `url(${_master.cover_url})`;
    coverEl.style.backgroundSize = 'cover';
    coverEl.style.backgroundPosition = 'center';
    document.getElementById('cover-label').style.display = 'none';
  }

  // Info
  document.getElementById('p-name').textContent = _profile.name || 'Без имени';
  document.getElementById('p-specialty').textContent = _master.specialty || '';
  if (_master.city) {
    document.getElementById('p-city-wrap').hidden = false;
    document.getElementById('p-city').textContent = _master.city;
  }
  if (_master.description) {
    document.getElementById('p-bio').textContent = _master.description;
  }

  // Stats
  const { count: bookingsCount } = await sb.from('bookings')
    .select('id', { count: 'exact', head: true }).eq('master_id', _profile.id);
  document.getElementById('stat-bookings').textContent = bookingsCount || 0;
  if (_master.rating > 0) {
    document.getElementById('stat-rating').innerHTML = _master.rating.toFixed(1) + '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-left:2px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  }

  // Link
  const username = _master.username || _profile.id;
  const pubUrl   = `https://bookme-app.online/p?u=${username}`;
  document.getElementById('p-link').textContent = `bookme-app.online/${username}`;
  document.getElementById('p-copy').onclick  = () => copyToClipboard(pubUrl);
  document.getElementById('p-share').onclick = async () => {
    const ok = await shareLink(pubUrl, _profile.name || 'BookMe');
    if (!ok) copyToClipboard(pubUrl);
  };

  // Avatar upload with crop
  document.getElementById('avatar-wrap').addEventListener('click', async () => {
    try {
      const blob = await pickAndCrop({ aspectRatio: 1, cropSize: 300 });
      toast('Загружаем…');
      const url = await uploadFile('avatars', `${_profile.id}/avatar`, blob);
      if (!url) return;
      await sb.from('profiles').update({ avatar_url: url }).eq('id', _profile.id);
      avatarEl.style.backgroundImage = `url(${url})`; avatarEl.textContent = '';
      toast('Фото обновлено');
    } catch {}
  });

  // Cover upload with crop
  coverEl.addEventListener('click', async () => {
    try {
      const blob = await pickAndCrop({ aspectRatio: 16/9, cropSize: 340 });
      toast('Загружаем…');
      const url = await uploadFile('avatars', `${_profile.id}/cover`, blob);
      if (!url) return;
      await sb.from('masters').update({ cover_url: url }).eq('id', _profile.id);
      coverEl.style.backgroundImage = `url(${url})`;
      coverEl.style.backgroundSize = 'cover';
      document.getElementById('cover-label').style.display = 'none';
      toast('Обложка обновлена');
    } catch {}
  });

  // Tabs
  document.getElementById('tab-portfolio').addEventListener('click', () => switchTab('portfolio'));
  document.getElementById('tab-services').addEventListener('click', () => switchTab('services'));

  function switchTab(t) {
    document.getElementById('tab-portfolio').classList.toggle('active', t === 'portfolio');
    document.getElementById('tab-services').classList.toggle('active', t === 'services');
    document.getElementById('view-portfolio').hidden = t !== 'portfolio';
    document.getElementById('view-services').hidden  = t !== 'services';
    if (t === 'services') loadServices();
  }

  // Portfolio
  const portfolioInput = Object.assign(document.createElement('input'),
    { type:'file', accept:'image/*', style:'display:none', multiple: true });
  document.body.appendChild(portfolioInput);

  async function loadPortfolio() {
    const { data: photos = [] } = await sb.from('portfolio')
      .select('*').eq('master_id', _profile.id).order('created_at', { ascending: false });

    document.getElementById('stat-portfolio').textContent = photos.length;

    const grid = document.getElementById('portfolio-grid');
    grid.innerHTML = photos.map(p => `
      <div class="insta-item" data-url="${p.url}" data-id="${p.id}">
        <img src="${p.url}" alt="" loading="lazy"/>
        <button class="insta-del" onclick="delPhoto('${p.id}',event)">×</button>
      </div>`).join('') +
      `<div class="insta-add" id="grid-add">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>`;

    grid.querySelectorAll('.insta-item').forEach(item => {
      item.addEventListener('click', e => {
        if (e.target.classList.contains('insta-del')) return;
        openLightbox(item.dataset.url);
      });
    });
    document.getElementById('grid-add').addEventListener('click', () => portfolioInput.click());
  }

  portfolioInput.addEventListener('change', async () => {
    const files = [...portfolioInput.files]; if (!files.length) return;
    toast(`Загружаем ${files.length} фото…`);
    for (const file of files) {
      const url = await uploadFile('portfolio', `${_profile.id}/${Date.now()}`, file);
      if (url) await sb.from('portfolio').insert({ master_id: _profile.id, url });
    }
    portfolioInput.value = '';
    await loadPortfolio();
    toast('Фото добавлено');
  });

  document.getElementById('add-photo-btn').addEventListener('click', () => portfolioInput.click());

  window.delPhoto = async (id, e) => {
    e.stopPropagation();
    await sb.from('portfolio').delete().eq('id', id);
    await loadPortfolio();
  };

  await loadPortfolio();

  // Services
  async function loadServices() {
    const { data: services = [] } = await sb.from('services')
      .select('*').eq('master_id', _profile.id).order('price');
    const list = document.getElementById('services-list');
    if (!services.length) {
      list.innerHTML = `<div class="empty" style="padding:30px 0;"><h4>Нет услуг</h4><p>Добавьте в разделе Услуги</p></div>`;
      return;
    }
    list.innerHTML = services.map(s => `
      <div class="svc-card" style="cursor:default;">
        ${s.image_url
          ? `<div class="svc-thumb"><img src="${s.image_url}" alt="${s.name}" loading="lazy"/></div>`
          : `<div class="svc-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;color:rgba(255,255,255,.3);"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`}
        <div class="svc-info">
          <div class="svc-name">${s.name}</div>
          <div class="svc-meta">${s.duration} мин</div>
        </div>
        <div class="svc-price">${fmt$(s.price)}</div>
      </div>`).join('');
  }

  renderMasterTabBar('profile');
})();

// Lightbox
function openLightbox(url) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = url;
  lb.hidden = false; lb.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  const lb = document.getElementById('lightbox');
  lb.hidden = true; lb.style.display = 'none';
  document.body.style.overflow = '';
}
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeLightbox();
});
</script>
</body>
</html>
