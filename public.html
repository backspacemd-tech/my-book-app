<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="manifest" href="manifest.json" />
  <title>Запись к мастеру</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BookMe" />
</head>
<body>
  <div class="public">
    <!-- Обложка-градиент -->
    <div class="public-cover"></div>

    <!-- Шапка профиля -->
    <header class="public-header">
      <div class="avatar" id="avatar">M</div>
      <h1 id="name">—</h1>
      <p class="role" id="role"></p>
      <p class="bio" id="description"></p>
      <div class="public-meta">
        <span class="badge rating" id="rating-badge" hidden>
          <span class="star"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span> <span id="rating-val">—</span>
          <span class="muted" style="margin-left:2px;">·</span>
          <span class="muted" id="rating-count">— отзывов</span>
        </span>
        <span class="badge" id="online-badge" style="display:inline-flex;align-items:center;gap:5px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> Онлайн-запись</span>
      </div>
    </header>

    <!-- Услуги -->
    <section class="section" style="margin-top: 24px;">
      <div class="section-head">
        <h3>Услуги</h3>
        <span class="muted" style="font-size: 13px;" id="select-hint">Выберите одну</span>
      </div>
      <div class="list" id="services"></div>
    </section>

    <!-- Отзывы (горизонтальный скроллер) -->
    <section class="section" id="reviews-section" hidden>
      <div class="section-head">
        <h3>Отзывы</h3>
        <span class="muted" style="font-size: 13px;" id="reviews-summary"></span>
      </div>
      <div class="scroller" id="reviews"></div>
    </section>

    <!-- Часы работы (моки) -->
    <section class="section">
      <div class="section-head"><h3>Время работы</h3></div>
      <div class="card" style="padding: 6px 16px;">
        <div class="row-item" style="border:none; padding: 10px 0; box-shadow:none; background:transparent;">
          <div class="meta"><div class="title" style="font-size: 14px;">Пн–Пт</div></div>
          <div class="muted" style="font-size: 14px;">10:00 – 19:00</div>
        </div>
        <div class="row-item" style="border:none; padding: 10px 0; box-shadow:none; background:transparent; border-top: 1px solid var(--border);">
          <div class="meta"><div class="title" style="font-size: 14px;">Сб–Вс</div></div>
          <div class="muted" style="font-size: 14px;">11:00 – 17:00</div>
        </div>
      </div>
    </section>

    <!-- Sticky CTA -->
    <div class="sticky-cta">
      <button class="btn btn-primary" id="book-btn" disabled>Выберите услугу</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const username = params.get('u');

    const user = Store.get(STORAGE.USER);

    document.getElementById('name').textContent = user.name || 'Мастер';
    document.getElementById('role').textContent = user.role || '';
    document.getElementById('description').textContent = user.description || '';
    document.getElementById('avatar').textContent = (user.name || 'M').trim().charAt(0).toUpperCase();

    // Рейтинг
    if (user.rating && user.reviewsCount) {
      document.getElementById('rating-badge').hidden = false;
      document.getElementById('rating-val').textContent = user.rating.toFixed(1);
      document.getElementById('rating-count').textContent = `${user.reviewsCount} отзывов`;
    }
    if (user.acceptsOnline === false) document.getElementById('online-badge').hidden = true;

    // Услуги
    const services = user.services || [];
    const list = document.getElementById('services');
    const bookBtn = document.getElementById('book-btn');
    const selectHint = document.getElementById('select-hint');
    let selectedId = null;

    if (!services.length) {
      list.innerHTML = `<div class="empty">
        <div class="empty-icon" style="font-size:0;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></div>
        <h4>Услуги не добавлены</h4>
        <p>Мастер пока не настроил прайс-лист</p>
      </div>`;
      bookBtn.style.display = 'none';
      selectHint.style.display = 'none';
    } else {
      list.innerHTML = services.map((s) => `
        <div class="service-card" data-id="${s.id}">
          <div class="check"></div>
          <div class="info">
            <h3>${s.name}</h3>
            <span class="duration">${s.duration} мин</span>
          </div>
          <div class="price">${fmt$(s.price)}</div>
        </div>
      `).join('');
      list.querySelectorAll('.service-card').forEach((card) => {
        card.addEventListener('click', () => {
          list.querySelectorAll('.service-card').forEach((c) => c.classList.remove('selected'));
          card.classList.add('selected');
          selectedId = card.dataset.id;
          bookBtn.disabled = false;
          const svc = services.find((s) => s.id === selectedId);
          bookBtn.textContent = `Записаться · ${fmt$(svc.price)}`;
        });
      });
    }

    // Отзывы
    if (user.reviews && user.reviews.length) {
      document.getElementById('reviews-section').hidden = false;
      document.getElementById('reviews-summary').textContent = `${user.rating?.toFixed(1) || ''} из 5`;
      document.getElementById('reviews').innerHTML = user.reviews.map((r) => `
        <div class="review-card">
          <div class="stars">${Array.from({length:r.stars},()=>'<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>').join('')}</div>
          <p>«${r.text}»</p>
          <div class="who">${r.who}</div>
        </div>
      `).join('');
    }

    bookBtn.addEventListener('click', () => {
      if (!selectedId) return;
      Store.set(STORAGE.DRAFT, {
        username: username || user.username,
        serviceId: selectedId,
      });
      window.location.href = `/booking?u=${encodeURIComponent(username || user.username)}&s=${selectedId}`;
    });
  </script>
</body>
</html>
