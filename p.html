<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>BookMe — запись к мастеру</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BookMe" />
  <style>
    /* Remove body safe-top so cover reaches top of screen */
    body { padding-top: 0; }
  </style>
</head>
<body>
  <div class="public">
    <!-- Cover — extends behind status bar -->
    <div class="public-cover" id="cover">
      <div class="cover-actions">
        <button class="cover-btn" id="back-btn" aria-label="Назад">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button class="cover-btn" id="share-btn" aria-label="Поделиться">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        </button>
      </div>
    </div>

    <header class="public-header">
      <div class="avatar" id="avatar">M</div>
      <h1 id="name">—</h1>
      <p class="role" id="role"></p>
      <p class="bio" id="bio"></p>
      <div class="public-meta">
        <span class="badge rating" id="rating-badge" hidden>
          <span class="star"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
          <span id="rating-val">—</span>
          <span class="muted" style="margin-left:2px;">·</span>
          <span class="muted" id="rating-count">—</span>
        </span>
        <span class="badge" id="online-badge" style="display:inline-flex;align-items:center;gap:5px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> Онлайн-запись</span>
      </div>
    </header>

    <!-- Services -->
    <section class="section" style="margin-top:24px;">
      <div class="section-head">
        <h3>Услуги</h3>
        <span class="muted" style="font-size:13px;" id="select-hint">Выберите одну</span>
      </div>
      <div class="list" id="services"></div>
    </section>

    <!-- Portfolio -->
    <section class="section" id="portfolio-section" hidden style="margin-top:24px;">
      <div class="section-head">
        <h3>Портфолио</h3>
        <span class="muted" style="font-size:13px;" id="portfolio-count"></span>
      </div>
      <div class="portfolio-grid" id="portfolio-grid"></div>
    </section>

    <!-- Reviews -->
    <section class="section" id="reviews-section" hidden style="margin-top:24px;">
      <div class="section-head">
        <h3>Отзывы</h3>
        <span class="muted" style="font-size:13px;" id="reviews-summary"></span>
      </div>
      <div class="scroller" id="reviews"></div>
    </section>

    <!-- Sticky CTA -->
    <div class="sticky-cta">
      <button class="btn btn-primary" id="book-btn" disabled>Выберите услугу</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    (async () => {
      const params   = new URLSearchParams(location.search);
      const username = params.get('u');
      if (!username) {
        document.body.innerHTML = '<div class="empty" style="padding:60px 24px;text-align:center;"><h4>Мастер не найден</h4></div>';
        return;
      }

      // Back button
      document.getElementById('back-btn').addEventListener('click', () => {
        if (history.length > 1) history.back();
        else location.href = '/';
      });

      // Load all data in parallel
      const [{ data: master }, { data: portfolio = [] }, { data: reviews = [] }] = await Promise.all([
        sb.from('masters').select('*, profiles(name, avatar_url, email)').eq('username', username).single(),
        sb.from('portfolio').select('*').eq('master_id',
          // We'll re-fetch after master loads — placeholder first
          '00000000-0000-0000-0000-000000000000'
        ),
        sb.from('reviews').select('*').eq('master_id',
          '00000000-0000-0000-0000-000000000000'
        ).order('created_at', { ascending: false }).limit(10),
      ]);

      if (!master) {
        document.body.innerHTML = '<div class="empty" style="padding:60px 24px;text-align:center;"><h4>Мастер не найден</h4><p>Проверьте правильность ссылки</p></div>';
        return;
      }

      const profile = master.profiles;

      // Render header
      document.title = `BookMe — ${profile?.name || 'Мастер'}`;
      document.getElementById('name').textContent = profile?.name || 'Мастер';
      document.getElementById('role').textContent = master.specialty || '';
      document.getElementById('bio').textContent  = master.description || '';

      const avatarEl = document.getElementById('avatar');
      if (profile?.avatar_url) {
        avatarEl.style.backgroundImage = `url(${profile.avatar_url})`;
        avatarEl.style.backgroundSize  = 'cover';
        avatarEl.style.backgroundPosition = 'center';
        avatarEl.textContent = '';
      } else {
        avatarEl.textContent = (profile?.name || 'M').charAt(0).toUpperCase();
      }

      if (master.cover_url) {
        document.getElementById('cover').style.backgroundImage = `url(${master.cover_url})`;
        document.getElementById('cover').style.backgroundSize  = 'cover';
        document.getElementById('cover').style.backgroundPosition = 'center';
      }

      if (master.rating > 0 && master.reviews_count > 0) {
        document.getElementById('rating-badge').hidden = false;
        document.getElementById('rating-val').textContent   = master.rating.toFixed(1);
        document.getElementById('rating-count').textContent = `${master.reviews_count} отзывов`;
      }
      if (!master.accepts_online) document.getElementById('online-badge').hidden = true;

      // Share button
      document.getElementById('share-btn').addEventListener('click', async () => {
        const url = location.href;
        if (navigator.share) {
          try { await navigator.share({ title: profile?.name || 'BookMe', url }); return; } catch {}
        }
        await copyToClipboard(url);
      });

      // Load services + portfolio + reviews in parallel (now we have master.id)
      const [{ data: services = [] }, { data: portPhotos = [] }, { data: revData = [] }] = await Promise.all([
        sb.from('services').select('*').eq('master_id', master.id).order('price'),
        sb.from('portfolio').select('*').eq('master_id', master.id).order('created_at', { ascending: false }),
        sb.from('reviews').select('*').eq('master_id', master.id).order('created_at', { ascending: false }).limit(10),
      ]);

      // Render services
      const servicesEl = document.getElementById('services');
      const bookBtn    = document.getElementById('book-btn');
      let selectedId   = null;

      if (!services.length) {
        servicesEl.innerHTML = `<div class="empty">
          <div class="empty-icon">${Icons.services}</div>
          <h4>Услуги не добавлены</h4>
          <p>Мастер пока не настроил прайс-лист</p>
        </div>`;
        bookBtn.style.display = 'none';
        document.getElementById('select-hint').style.display = 'none';
      } else {
        const thumb = s => s.image_url
          ? `<div class="svc-thumb"><img src="${s.image_url}" alt="${s.name}" loading="lazy"/></div>`
          : `<div class="svc-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>`;

        servicesEl.innerHTML = services.map(s => `
          <div class="svc-card" data-id="${s.id}">
            ${thumb(s)}
            <div class="svc-info">
              <div class="svc-name">${s.name}</div>
              <div class="svc-meta">${s.duration} мин${s.description ? ' · ' + s.description : ''}</div>
            </div>
            <div class="svc-price">${fmt$(s.price)}</div>
            <div class="svc-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
          </div>`).join('');

        servicesEl.querySelectorAll('.svc-card').forEach(card => {
          card.addEventListener('click', () => {
            servicesEl.querySelectorAll('.svc-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedId = card.dataset.id;
            const svc = services.find(s => s.id === selectedId);
            bookBtn.disabled = false;
            bookBtn.textContent = `Записаться · ${fmt$(svc.price)}`;
          });
        });
      }

      // Render portfolio
      if (portPhotos.length) {
        document.getElementById('portfolio-section').hidden = false;
        document.getElementById('portfolio-count').textContent = `${portPhotos.length} фото`;
        document.getElementById('portfolio-grid').innerHTML = portPhotos.map(p =>
          `<div class="portfolio-item"><img src="${p.url}" alt="" loading="lazy"/></div>`
        ).join('');
      }

      // Render reviews
      if (revData.length) {
        document.getElementById('reviews-section').hidden = false;
        document.getElementById('reviews-summary').textContent = master.rating > 0 ? `${master.rating.toFixed(1)} из 5` : '';
        document.getElementById('reviews').innerHTML = revData.map(r => `
          <div class="review-card">
            <div class="stars">${Array.from({length:r.stars},()=>'<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>').join('')}</div>
            <p>«${r.text}»</p>
            <div class="who">${r.who || 'Аноним'}</div>
          </div>`).join('');
      }

      // Book button
      bookBtn.addEventListener('click', () => {
        if (!selectedId) return;
        location.href = `/booking?u=${encodeURIComponent(username)}&s=${selectedId}`;
      });
    })();
  </script>
</body>
</html>
