[build]
  publish = "."

# Clean URLs — redirect /page → /page.html
[[redirects]]
  from = "/dashboard"
  to   = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/master"
  to   = "/master.html"
  status = 200

[[redirects]]
  from = "/profile"
  to   = "/profile.html"
  status = 200

[[redirects]]
  from = "/services"
  to   = "/services.html"
  status = 200

[[redirects]]
  from = "/bookings"
  to   = "/bookings.html"
  status = 200

[[redirects]]
  from = "/analytics"
  to   = "/analytics.html"
  status = 200

[[redirects]]
  from = "/client"
  to   = "/client.html"
  status = 200

[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200

[[redirects]]
  from = "/chat"
  to   = "/chat.html"
  status = 200

[[redirects]]
  from = "/subscription"
  to   = "/subscription.html"
  status = 200

# Master public profile: /m/:username → /p.html?u=:username
[[redirects]]
  from  = "/m/:username"
  to    = "/p.html?u=:username"
  status = 200

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
