<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BookMe" />
  <title>BookMe — записи</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn-circle" href="/master" aria-label="Назад" style="display:inline-flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
      <span></span>
      <span class="right-spacer"></span>
    </header>
    <section class="hero" style="padding-bottom:14px;">
      <h2>Все записи</h2>
      <p id="summary">—</p>
    </section>
    <div class="tabs" role="tablist">
      <div class="tab active" data-filter="upcoming">Предстоящие</div>
      <div class="tab" data-filter="today">Сегодня</div>
      <div class="tab" data-filter="past">Прошлые</div>
    </div>
    <section class="section" style="margin-top:8px;">
      <div class="list" id="list"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    let _allBookings = [], _masterId;

    async function load() {
      const { data } = await sb.from('bookings').select('*').eq('master_id', _masterId).order('date_iso', { ascending: false });
      _allBookings = data || [];
      const upcoming = bookingsByDate(_allBookings, 'upcoming').length;
      const today    = bookingsByDate(_allBookings, 'today').length;
      document.getElementById('summary').textContent = `${upcoming} предстоящих · ${today} сегодня`;
      render(document.querySelector('.tab.active')?.dataset.filter || 'upcoming');
    }

    function render(filter) {
      const data   = bookingsByDate(_allBookings, filter);
      const sorted = [...data].sort((a,b) => filter === 'past' ? (a.date_iso < b.date_iso ? 1 : -1) : (a.date_iso > b.date_iso ? 1 : -1));
      const list = document.getElementById('list');
      if (!sorted.length) {
        list.innerHTML = `<div class="empty"><div class="empty-icon" style="font-size:0;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div><h4>${filter==='past' ? 'Прошлых записей нет' : 'Записей пока нет'}</h4><p>Поделитесь ссылкой, чтобы клиенты записались</p></div>`;
        return;
      }
      list.classList.remove('stagger'); void list.offsetWidth;
      list.innerHTML = sorted.map(b => {
        const status = isToday(b.date_iso) ? 'today' : isFuture(b.date_iso) ? 'upcoming' : 'past';
        const label  = { today:'сегодня', upcoming:'предстоит', past:'прошло' }[status];
        const dateLabel = b.date_iso + ', ' + b.time;
        return `<div class="row-item clickable" data-id="${b.id}">
          <div class="mini-avatar gradient">${b.client_name.charAt(0)}</div>
          <div class="meta"><div class="title">${b.client_name}</div><div class="sub">${b.service_name} · ${dateLabel}</div></div>
          <div class="meta" style="text-align:right;flex:0 0 auto;">
            <div class="price">${fmt$(b.service_price)}</div>
            <span class="chip-status ${status}">${label}</span>
          </div>
        </div>`;
      }).join('');
      list.classList.add('stagger');
      list.querySelectorAll('.row-item').forEach(row => row.addEventListener('click', () => openDetails(row.dataset.id)));
    }

    function openDetails(id) {
      const b = _allBookings.find(x => x.id === id); if (!b) return;
      const status = isToday(b.date_iso) ? 'today' : isFuture(b.date_iso) ? 'upcoming' : 'past';
      const label  = { today:'сегодня', upcoming:'предстоит', past:'прошло' }[status];
      openSheet(`
        <h3>Запись</h3>
        <p class="muted" style="margin:0 0 14px;font-size:14px;">${b.date_iso}, ${b.time}</p>
        <div class="card" style="padding:6px 16px;">
          <div class="row-item" style="border:none;padding:12px 0;box-shadow:none;background:transparent;">
            <div class="mini-avatar gradient">${b.client_name.charAt(0)}</div>
            <div class="meta"><div class="title">${b.client_name}</div><div class="sub">${b.client_phone}</div></div>
            <span class="chip-status ${status}">${label}</span>
          </div>
          <div style="border-top:1px solid var(--border);padding:12px 0;">
            <div class="flex-between"><span class="muted" style="font-size:13px;">Услуга</span><span style="font-weight:600;font-size:14px;">${b.service_name}</span></div>
            <div class="flex-between mt-8"><span class="muted" style="font-size:13px;">Стоимость</span><span style="font-weight:600;font-size:14px;">${fmt$(b.service_price)}</span></div>
            ${b.client_email ? `<div class="flex-between mt-8"><span class="muted" style="font-size:13px;">Email</span><span style="font-size:14px;">${b.client_email}</span></div>` : ''}
          </div>
        </div>
        <div class="btn-row mt-16">
          <a class="btn btn-secondary" href="tel:${b.client_phone.replace(/\s/g,'')}">Позвонить</a>
          ${b.client_id ? `<a class="btn btn-secondary" href="/messages?master=${_masterId}&partner=${b.client_id}" style="display:inline-flex;gap:6px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Чат</a>` : ''}
        </div>
        <button class="btn btn-primary mt-8" onclick="closeSheet()">Закрыть</button>
        ${status !== 'past' ? `<button class="btn btn-danger mt-12" id="cancel-btn">Отменить запись</button>` : ''}
      `);
      document.getElementById('cancel-btn')?.addEventListener('click', async () => {
        await sb.from('bookings').update({ status:'cancelled' }).eq('id', id);
        closeSheet(); toast('Запись отменена', { icon:'✓' }); await load();
      });
    }

    (async () => {
      const auth = await requireAuth('master');
      if (!auth) return;
      _masterId = auth.profile.id;
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          render(tab.dataset.filter);
        });
      });
      await load();
      // Realtime
      sb.channel('bookings-list').on('postgres_changes', { event:'*', schema:'public', table:'bookings', filter:`master_id=eq.${_masterId}` }, load).subscribe();
      renderMasterTabBar('bookings');
    })();
  </script>
</body>
</html>
