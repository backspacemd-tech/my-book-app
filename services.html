<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BookMe" />
  <title>BookMe — услуги</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="icon-btn-circle" href="/master" aria-label="Назад" style="display:inline-flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
      <span></span>
      <button class="icon-btn-circle" id="add-btn" aria-label="Добавить" style="display:inline-flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </header>
    <section class="hero" style="padding-bottom:14px;">
      <h2>Прайс-лист</h2>
      <p id="summary">—</p>
    </section>
    <section class="section">
      <div class="list" id="list"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    let _masterId, _services = [];

    async function load() {
      const { data } = await sb.from('services').select('*').eq('master_id', _masterId).order('created_at');
      _services = data || [];
      render();
    }

    function render() {
      const avg = _services.length ? Math.round(_services.reduce((s,x) => s+x.price,0)/_services.length) : 0;
      document.getElementById('summary').textContent = _services.length
        ? `${_services.length} услуг · средняя цена ${fmt$(avg)}`
        : 'Добавьте первую услугу';
      const list = document.getElementById('list');
      if (!_services.length) {
        list.innerHTML = `<div class="empty"><div class="empty-icon" style="font-size:0;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></div><h4>Добавьте первую услугу</h4><p>Клиенты увидят что вы предлагаете и сколько стоит</p></div>
          <button class="btn btn-primary mt-16" onclick="openForm()">Добавить услугу</button>`;
        return;
      }
      list.innerHTML = _services.map(s => {
        const thumb = s.image_url
          ? `<div class="svc-thumb" style="width:52px;height:52px;"><img src="${s.image_url}" alt="${s.name}" loading="lazy"/></div>`
          : `<div class="svc-thumb" style="width:52px;height:52px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;color:rgba(255,255,255,.4);"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;
        return `<div class="row-item clickable" data-id="${s.id}" style="gap:12px;">
          ${thumb}
          <div class="meta"><div class="title">${s.name}</div><div class="sub">${s.duration} мин</div></div>
          <div class="meta" style="text-align:right;flex:0 0 auto;"><div class="price">${fmt$(s.price)}</div></div>
        </div>`;
      }).join('');
      list.querySelectorAll('.row-item').forEach(row => row.addEventListener('click', () => openForm(row.dataset.id)));
    }

    let _pendingImageBlob = null;

    window.openForm = function(id) {
      const s = id ? _services.find(x => x.id === id) : null;
      _pendingImageBlob = null;
      const imgPreview = s?.image_url
        ? `<img src="${s.image_url}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;" />`
        : `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;

      openSheet(`
        <h3>${s ? 'Редактировать' : 'Новая'} услуга</h3>
        <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px;">
          <div id="svc-img-preview" style="width:72px;height:72px;border-radius:14px;background:linear-gradient(135deg,#2D1B69,#4C1D95);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;cursor:pointer;" onclick="pickSvcImage()">
            ${imgPreview}
          </div>
          <button type="button" class="btn btn-secondary btn-sm" onclick="pickSvcImage()" style="flex:1;">
            ${Icons.camera} Фото услуги
          </button>
        </div>
        <div class="field"><label>Название</label><input id="s-name" type="text" placeholder="Маникюр" value="${s ? s.name.replace(/"/g,'&quot;') : ''}" /></div>
        <div class="field"><label>Описание (необязательно)</label><input id="s-desc" type="text" placeholder="Краткое описание" value="${s?.description || ''}" /></div>
        <div class="field-row">
          <div class="field"><label>Цена, $</label><input id="s-price" type="number" min="0" step="1" placeholder="35" value="${s ? s.price : ''}" /></div>
          <div class="field"><label>Мин.</label><input id="s-dur" type="number" min="5" step="5" placeholder="60" value="${s ? s.duration : ''}" /></div>
        </div>
        <div class="btn-row mt-12">
          <button class="btn btn-secondary" onclick="closeSheet()">Отмена</button>
          <button class="btn btn-primary" id="s-save">${s ? 'Сохранить' : 'Добавить'}</button>
        </div>
        ${s ? `<button class="btn btn-danger mt-12" id="s-del">Удалить услугу</button>` : ''}
      `);

      document.getElementById('s-save').addEventListener('click', async () => {
        const name        = document.getElementById('s-name').value.trim();
        const description = document.getElementById('s-desc').value.trim();
        const price       = parseInt(document.getElementById('s-price').value, 10);
        const duration    = parseInt(document.getElementById('s-dur').value, 10);
        if (!name || !price || !duration) { toast('Заполните все поля'); return; }
        const btn = document.getElementById('s-save');
        btn.disabled = true; btn.textContent = 'Сохраняем…';

        let image_url = s?.image_url || null;
        if (_pendingImageBlob) {
          const path = `services/${_masterId}/${Date.now()}.jpg`;
          const uploaded = await uploadFile('services', path, _pendingImageBlob);
          if (uploaded) image_url = uploaded;
        }
        const payload = { name, description, price, duration, image_url };
        if (s) await sb.from('services').update(payload).eq('id', s.id);
        else   await sb.from('services').insert({ master_id: _masterId, ...payload });
        closeSheet(); await load(); toast(s ? 'Сохранено' : 'Услуга добавлена');
      });
      document.getElementById('s-del')?.addEventListener('click', async () => {
        await sb.from('services').delete().eq('id', s.id);
        closeSheet(); await load(); toast('Услуга удалена');
      });
    };

    window.pickSvcImage = async function() {
      try {
        const blob = await pickAndCrop({ aspectRatio: 1, cropSize: 260 });
        _pendingImageBlob = blob;
        const url = URL.createObjectURL(blob);
        document.getElementById('svc-img-preview').innerHTML =
          `<img src="${url}" style="width:100%;height:100%;object-fit:cover;border-radius:12px;" />`;
      } catch {}
    };

    (async () => {
      const auth = await requireAuth('master');
      if (!auth) return;
      _masterId = auth.profile.id;
      document.getElementById('add-btn').addEventListener('click', () => openForm());
      await load();
      renderMasterTabBar('services');
    })();
  </script>
</body>
</html>
