<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0A0A0A"/>
  <title>BookMe · Сообщения</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="icon-btn-circle" href="javascript:history.back()" aria-label="Назад" style="display:inline-flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>Сообщения</h1>
    <span class="right-spacer"></span>
  </header>

  <!-- Search -->
  <div style="padding:10px 20px 0;">
    <div style="position:relative;">
      <input id="search-input" type="search" placeholder="Поиск по имени…"
        style="width:100%;box-sizing:border-box;padding:11px 16px 11px 42px;
               border:1px solid var(--border);border-radius:var(--r);
               font-size:15px;background:var(--surface);color:var(--text);outline:none;"/>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"
        style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </div>
  </div>

  <section class="section" style="margin-top:14px;">
    <div id="threads-list">
      <!-- skeleton -->
      <div style="display:flex;flex-direction:column;gap:2px;" id="skeleton-wrap">
        ${Array(5).fill(0).map(() => `
          <div class="sk-card" style="border-radius:0;border:none;border-bottom:1px solid var(--border);padding:14px 20px;">
            <span class="sk sk-avatar" style="width:50px;height:50px;flex-shrink:0;"></span>
            <div style="flex:1;">
              <span class="sk sk-title" style="width:45%;display:block;margin-bottom:8px;"></span>
              <span class="sk sk-text" style="width:70%;display:block;"></span>
            </div>
          </div>`).join('')}
      </div>
    </div>
  </section>
</div>

<style>
.thread-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 20px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background .12s;
  text-decoration: none;
  color: inherit;
}
.thread-row:active { background: var(--surface-2); }
.thread-av {
  width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, #2D1B69, #5B21B6);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 700; color: white;
  position: relative; overflow: hidden;
}
.thread-av img { width: 100%; height: 100%; object-fit: cover; }
.thread-badge {
  position: absolute; top: 0; right: 0;
  min-width: 18px; height: 18px; border-radius: 100px;
  background: var(--rose); color: white;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px; border: 2px solid var(--bg);
}
.thread-info { flex: 1; min-width: 0; }
.thread-name {
  font-size: 15px; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}
.thread-name .t-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.thread-name .t-time { font-size: 12px; color: var(--text-3); font-weight: 400; flex-shrink: 0; }
.thread-preview {
  font-size: 13px; color: var(--text-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 3px;
}
.thread-preview.unread { color: var(--text); font-weight: 500; }
.empty-inbox {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 24px; text-align: center; gap: 14px;
}
.empty-inbox-icon {
  width: 72px; height: 72px; border-radius: 22px;
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
let _me, _masterId, _threads = [], _query = '';

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString())
    return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
  if (d.toDateString() === yesterday.toDateString()) return 'Вчера';
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}

async function loadThreads() {
  // Get all messages involving me
  const { data: msgs = [] } = await sb.from('messages')
    .select('*')
    .or(`from_id.eq.${_me.id},to_id.eq.${_me.id}`)
    .order('created_at', { ascending: false });

  // Group into threads by the other participant + master_id
  const threadMap = new Map();
  for (const m of msgs) {
    const partnerId = m.from_id === _me.id ? m.to_id : m.from_id;
    const key = `${m.master_id}:${partnerId}`;
    if (!threadMap.has(key)) {
      threadMap.set(key, {
        masterId: m.master_id,
        partnerId,
        lastMsg: m,
        unread: 0,
      });
    }
    const t = threadMap.get(key);
    if (m.to_id === _me.id && !m.read_at) t.unread++;
  }

  // Load partner profiles
  const partnerIds = [...new Set([...threadMap.values()].map(t => t.partnerId))];
  let profiles = {};
  if (partnerIds.length) {
    const { data: profs = [] } = await sb.from('profiles')
      .select('id, name, avatar_url').in('id', partnerIds);
    profs.forEach(p => profiles[p.id] = p);
  }

  _threads = [...threadMap.values()].map(t => ({
    ...t,
    partner: profiles[t.partnerId] || { id: t.partnerId, name: 'Пользователь' },
  }));

  render();
}

function render() {
  const q = _query.toLowerCase();
  const list = q
    ? _threads.filter(t => t.partner.name?.toLowerCase().includes(q))
    : _threads;

  const container = document.getElementById('threads-list');
  document.getElementById('skeleton-wrap')?.remove();

  if (!list.length) {
    container.innerHTML = `
      <div class="empty-inbox">
        <div class="empty-inbox-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <h4 style="margin:0;font-size:17px;font-weight:600;">${q ? 'Не найдено' : 'Нет сообщений'}</h4>
        <p style="margin:0;font-size:14px;color:var(--text-2);">${q ? 'Попробуйте другое имя' : 'Переписки появятся здесь после первых записей'}</p>
      </div>`;
    return;
  }

  container.innerHTML = list.map(t => {
    const initial = (t.partner.name || '?').charAt(0).toUpperCase();
    const isMine  = t.lastMsg.from_id === _me.id;
    const preview = (isMine ? 'Вы: ' : '') + t.lastMsg.text;
    const url     = `/messages?master=${t.masterId}&partner=${t.partnerId}`;
    const av      = t.partner.avatar_url
      ? `<img src="${t.partner.avatar_url}" alt="${initial}"/>`
      : initial;
    const badge   = t.unread > 0 ? `<span class="thread-badge">${t.unread}</span>` : '';

    return `<a href="${url}" class="thread-row">
      <div class="thread-av">${av}${badge}</div>
      <div class="thread-info">
        <div class="thread-name">
          <span class="t-name">${t.partner.name || 'Пользователь'}</span>
          <span class="t-time">${fmtTime(t.lastMsg.created_at)}</span>
        </div>
        <div class="thread-preview${t.unread > 0 ? ' unread' : ''}">${preview}</div>
      </div>
    </a>`;
  }).join('');
}

(async () => {
  const auth = await requireAuth();
  if (!auth) return;
  _me = auth.profile;
  _masterId = _me.role === 'master' ? _me.id : null;

  document.getElementById('search-input').addEventListener('input', e => {
    _query = e.target.value; render();
  });

  await loadThreads();

  // Realtime: refresh on new message
  sb.channel('inbox-realtime')
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'messages',
    }, () => loadThreads())
    .subscribe();

  // Tab bar
  if (_me.role === 'master') renderMasterTabBar('messages');
  else renderClientTabBar('mybookings');
})();
</script>
</body>
</html>
