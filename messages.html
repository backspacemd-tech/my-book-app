<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0E1621"/>
  <title>BookMe · Чат</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
</head>
<body style="background:#0E1621;margin:0;">
<div class="tg-page">

  <div class="tg-header">
    <button class="tg-back" onclick="history.length>1?history.back():location.href='/'" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="tg-av" id="tg-av">?</div>
    <div class="tg-hinfo">
      <div class="tg-hname"  id="tg-name">Загрузка…</div>
      <div class="tg-hstatus" id="tg-status"></div>
    </div>
  </div>

  <div class="tg-msgs" id="tg-msgs"></div>

  <div class="tg-input-bar">
    <div class="tg-input-wrap">
      <textarea id="msg-input" placeholder="Сообщение…" rows="1"></textarea>
    </div>
    <button class="tg-send-btn" id="send-btn" disabled aria-label="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const p        = new URLSearchParams(location.search);
  const masterId = p.get('master');
  const otherId  = p.get('partner');

  if (!masterId || !otherId) {
    document.getElementById('tg-msgs').innerHTML =
      '<div class="tg-system" style="margin-top:40px;">Неверные параметры чата</div>';
    return;
  }

  const auth = await requireAuth();
  if (!auth) return;
  const me = auth.profile;

  // Load partner name
  const { data: other } = await sb.from('profiles')
    .select('name, avatar_url').eq('id', otherId).single();
  const otherName    = other?.name || 'Пользователь';
  const otherInitial = otherName.charAt(0).toUpperCase();
  document.getElementById('tg-name').textContent = otherName;
  const avEl = document.getElementById('tg-av');
  if (other?.avatar_url) {
    avEl.innerHTML = `<img src="${other.avatar_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"/>`;
  } else {
    avEl.textContent = otherInitial;
  }

  // ── Load messages (simple filter — no complex OR) ──────────
  async function loadMsgs() {
    // Get all messages in this thread by master_id
    // then filter client-side for the two participants
    const { data, error } = await sb.from('messages')
      .select('*')
      .eq('master_id', masterId)
      .order('created_at', { ascending: true })
      .limit(200);

    if (error) { console.error('[Chat] load error:', error); return; }

    // Filter to only messages between me and other
    const thread = (data || []).filter(m =>
      (m.from_id === me.id && m.to_id === otherId) ||
      (m.from_id === otherId && m.to_id === me.id)
    );

    render(thread);

    // Mark received messages as read
    const unread = thread.filter(m => m.to_id === me.id && !m.read_at).map(m => m.id);
    if (unread.length) {
      await sb.from('messages').update({ read_at: new Date().toISOString() }).in('id', unread);
    }
  }

  // ── Render ─────────────────────────────────────────────────
  function esc(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }
  function fmt(iso) {
    return new Date(iso).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  }
  function fmtDate(iso) {
    const d = new Date(iso), t = new Date();
    const y = new Date(t); y.setDate(t.getDate()-1);
    if (d.toDateString()===t.toDateString()) return 'Сегодня';
    if (d.toDateString()===y.toDateString()) return 'Вчера';
    return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  }

  const container = document.getElementById('tg-msgs');

  function render(msgs) {
    if (!msgs.length) {
      container.innerHTML = `
        <div class="tg-empty">
          <div class="tg-empty-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <p>Начните переписку</p>
        </div>`;
      return;
    }

    const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;
    let html = '', lastDate = '', lastFrom = '';

    for (let i = 0; i < msgs.length; i++) {
      const m      = msgs[i];
      const isMine = m.from_id === me.id;
      const dKey   = m.created_at.slice(0,10);
      const isLast = !msgs[i+1] || msgs[i+1].from_id !== m.from_id;

      if (dKey !== lastDate) {
        html += `<div class="tg-date"><span>${fmtDate(m.created_at)}</span></div>`;
        lastDate = dKey;
      }

      const gap = lastFrom && lastFrom !== m.from_id ? 'margin-top:8px;' : 'margin-top:2px;';
      lastFrom = m.from_id;

      const avHtml = !isMine && isLast
        ? `<div class="tg-av-sm">${otherInitial}</div>`
        : !isMine
        ? `<div style="width:30px;flex-shrink:0;"></div>`
        : '';

      const tick = isMine
        ? `<span class="tg-check"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
            ${m.read_at
              ? '<polyline points="1 9 5 13 15 3" style="stroke:var(--tg-read)"/><polyline points="5 9 9 13 15 3" style="stroke:var(--tg-read);opacity:.7"/>'
              : '<polyline points="2 9 6 13 14 3" style="stroke:rgba(255,255,255,.5)"/>'}
          </svg></span>` : '';

      html += `
        <div class="tg-row ${isMine?'me':'them'}" style="${gap}">
          ${avHtml}
          <div class="tg-bubble-wrap">
            <div class="tg-bubble">
              ${esc(m.text)}
              <div class="tg-meta">
                <span class="tg-time">${fmt(m.created_at)}</span>
                ${tick}
              </div>
            </div>
          </div>
        </div>`;
    }

    container.innerHTML = html;
    if (atBottom || msgs.length <= 30) container.scrollTop = container.scrollHeight;
  }

  await loadMsgs();

  // ── Send ───────────────────────────────────────────────────
  const input  = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');

  input.addEventListener('input', () => {
    sendBtn.disabled = !input.value.trim();
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 600) {
      e.preventDefault(); doSend();
    }
  });

  sendBtn.addEventListener('click', doSend);

  async function doSend() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    sendBtn.disabled = true;
    input.value = ''; input.style.height = 'auto';

    const { error } = await sb.from('messages').insert({
      from_id:   me.id,
      to_id:     otherId,
      master_id: masterId,
      text,
    });

    if (error) {
      toast('Ошибка: ' + error.message);
      sendBtn.disabled = false;
    } else {
      await loadMsgs();
    }
    input.focus();
  }

  // ── Realtime ───────────────────────────────────────────────
  sb.channel(`chat:${masterId}:${[me.id,otherId].sort().join(':')}`)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'messages',
      filter: `master_id=eq.${masterId}`,
    }, () => loadMsgs())
    .subscribe(status => {
      document.getElementById('tg-status').textContent =
        status === 'SUBSCRIBED' ? 'в сети' : 'подключение…';
    });
})();
</script>
</body>
</html>
