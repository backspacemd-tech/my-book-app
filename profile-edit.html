<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0A0A0A"/>
  <title>BookMe · Редактировать профиль</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="icon-btn-circle" href="/profile" aria-label="Назад" style="display:inline-flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1>Редактировать</h1>
    <button id="save-btn" class="btn btn-sm btn-primary" style="padding:8px 16px;font-size:14px;width:auto;">Сохранить</button>
  </header>

  <form id="profile-form" style="padding:16px 20px 0;">

    <p class="section-label">О мастере</p>
    <div class="card" style="margin-bottom:18px;">
      <div class="field"><label for="f-name">Имя / Название</label><input id="f-name" type="text" placeholder="Анна Соколова" autocomplete="name"/></div>
      <div class="field"><label for="f-phone">Телефон</label><input id="f-phone" type="tel" placeholder="+373 69 000 000" autocomplete="tel"/></div>
      <div class="field"><label for="f-city">Город</label><input id="f-city" type="text" placeholder="Кишинёв, Москва, Бухарест…"/></div>
      <div class="field" style="margin-bottom:0;"><label for="f-desc">О себе</label><textarea id="f-desc" placeholder="Расскажите клиентам о себе…"></textarea></div>
    </div>

    <p class="section-label">Специализация</p>
    <div style="margin-bottom:18px;">
      <div class="chips" id="spec-chips" style="flex-wrap:wrap;gap:8px;">
        <div class="chip" data-val="beauty">Бьюти</div>
        <div class="chip" data-val="barber">Барбер</div>
        <div class="chip" data-val="nail">Ногти</div>
        <div class="chip" data-val="massage">Массаж</div>
        <div class="chip" data-val="trainer">Тренер</div>
        <div class="chip" data-val="tattoo">Тату</div>
        <div class="chip" data-val="photo">Фото</div>
        <div class="chip" data-val="other">Другое</div>
      </div>
    </div>

    <p class="section-label">Личная ссылка</p>
    <div class="card" style="margin-bottom:18px;">
      <div class="field" style="margin-bottom:0;">
        <label for="f-username">Username</label>
        <input id="f-username" type="text" pattern="[a-z0-9_]{3,20}" placeholder="anna" autocomplete="off"/>
        <div class="field-hint">bookme-app.online/<span id="username-preview">username</span></div>
      </div>
    </div>

    <p class="section-label">Онлайн-запись</p>
    <div class="card" style="margin-bottom:24px;padding:0;">
      <div class="row-item" style="border:none;box-shadow:none;background:transparent;">
        <div class="meta">
          <div class="title" style="font-size:15px;">Принимаю записи онлайн</div>
          <div class="sub">Клиенты увидят кнопку «Записаться»</div>
        </div>
        <label class="switch"><input type="checkbox" id="f-online"/><span class="slider"></span></label>
      </div>
    </div>

    <p class="section-label">Соцсети</p>
    <div class="card" style="margin-bottom:24px;">
      <div style="margin-top:0;">
        <label class="field-label" style="font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px;display:block;">Instagram</label>
        <div style="position:relative;">
          <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:14px;pointer-events:none;">@</span>
          <input id="f-instagram" type="text" placeholder="username" autocomplete="off" inputmode="url"
            style="width:100%;box-sizing:border-box;padding:12px 16px 12px 32px;border:1px solid var(--border);border-radius:var(--r);font-size:15px;background:var(--surface);color:var(--text);outline:none;"/>
        </div>
      </div>
      <div style="margin-top:12px;">
        <label class="field-label" style="font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px;display:block;">Telegram</label>
        <div style="position:relative;">
          <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:14px;pointer-events:none;">@</span>
          <input id="f-telegram" type="text" placeholder="username" autocomplete="off" inputmode="url"
            style="width:100%;box-sizing:border-box;padding:12px 16px 12px 32px;border:1px solid var(--border);border-radius:var(--r);font-size:15px;background:var(--surface);color:var(--text);outline:none;"/>
        </div>
      </div>
    </div>

  </form>
</div>

<style>
.section-label {
  font-size:12px;color:var(--text-2);text-transform:uppercase;
  letter-spacing:.07em;margin:0 4px 8px;font-weight:600;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
let _profile, _master;

(async () => {
  const auth = await requireAuth('master');
  if (!auth) return;
  _profile = auth.profile;

  const { data: master } = await sb.from('masters').select('*').eq('id', _profile.id).single();
  _master = master || {};

  // Fill form
  document.getElementById('f-name').value     = _profile.name || '';
  document.getElementById('f-phone').value    = _master.phone || '';
  document.getElementById('f-city').value     = _master.city  || '';
  document.getElementById('f-desc').value     = _master.description || '';
  document.getElementById('f-username').value = _master.username || '';
  document.getElementById('f-online').checked = _master.accepts_online !== false;
  document.getElementById('username-preview').textContent = _master.username || 'username';
  document.getElementById('f-instagram').value = _master.instagram || '';
  document.getElementById('f-telegram').value = _master.telegram || '';

  // Specialty chips
  const chips = document.querySelectorAll('#spec-chips .chip');
  const setSpec = v => chips.forEach(c => c.classList.toggle('active', c.dataset.val === v));
  setSpec(_master.specialty || '');
  chips.forEach(c => c.addEventListener('click', () => setSpec(c.dataset.val)));

  // Username preview
  document.getElementById('f-username').addEventListener('input', e => {
    e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
    document.getElementById('username-preview').textContent = e.target.value || 'username';
  });

  // Save
  document.getElementById('save-btn').addEventListener('click', async () => {
    const name        = document.getElementById('f-name').value.trim();
    const phone       = document.getElementById('f-phone').value.trim();
    const city        = document.getElementById('f-city').value.trim();
    const description = document.getElementById('f-desc').value.trim();
    const username    = document.getElementById('f-username').value.trim();
    const specialty   = document.querySelector('#spec-chips .chip.active')?.dataset.val || '';
    const accepts     = document.getElementById('f-online').checked;

    if (username && !/^[a-z0-9_]{3,20}$/.test(username)) {
      toast('Username: 3–20 символов, только латиница/цифры'); return;
    }

    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Сохраняем…';

    const [r1, r2] = await Promise.all([
      sb.from('profiles').update({ name }).eq('id', _profile.id),
      sb.from('masters').update({
        specialty, description, accepts_online: accepts, phone, city,
        ...(username ? { username } : {}),
        instagram: (document.getElementById('f-instagram').value || '').replace(/^@/,'').trim() || null,
        telegram: (document.getElementById('f-telegram').value || '').replace(/^@/,'').trim() || null,
      }).eq('id', _profile.id),
    ]);

    if (r1.error || r2.error) {
      toast('Ошибка сохранения');
      btn.disabled = false; btn.textContent = 'Сохранить';
      return;
    }
    toast('Профиль сохранён');
    setTimeout(() => location.href = '/profile', 600);
  });
})();
</script>
</body>
</html>
